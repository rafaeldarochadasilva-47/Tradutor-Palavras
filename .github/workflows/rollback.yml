name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to restore as Latest"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Restore release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG"
          gh release edit "$TAG" --latest
          echo "Release $TAG passed as Latest" 
